<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>cros photovoltaics</title>
  <meta name="description" content="A photovoltaic cache will be vastly improved by a longer-lifetime phase change photonic memory system.">
  <style>
    :root {
      --bg: #000;
      --fg: #ededed;
      --muted: #8a8a8a;
      --line: #2a2a2a;
    }
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
      display: grid;
      place-items: center;
      padding: 16px;
      -webkit-font-smoothing: antialiased;
    }
    main {
      width: 100%;
      max-width: 720px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 40px;
    }
    .logo {
      width: 100%;
      height: auto;
      mix-blend-mode: lighten; /* lets the logo's near-black backdrop melt into the page */
    }
    .thesis {
      color: var(--muted);
      font-size: clamp(15px, 2.2vw, 18px);
      line-height: 1.6;
      max-width: 52ch;
    }
    .thesis strong { color: var(--fg); font-weight: 600; }
    .github {
      color: var(--muted);
      display: inline-flex;
      transition: color .2s;
    }
    .github:hover, .github:focus-visible { color: var(--fg); }
    .github svg { width: 28px; height: 28px; }
    .links {
      display: flex;
      align-items: center;
      gap: 20px;
      font-size: 14px;
    }
    .btn {
      color: var(--fg);
      text-decoration: none;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 9px 20px;
      transition: border-color .2s, background .2s;
    }
    .btn:hover, .btn:focus-visible { border-color: var(--fg); background: #111; }
    :focus-visible { outline: 2px solid var(--fg); outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="logo.webp" alt="cros photovoltaics" width="2000" height="242">

    <p class="thesis"><strong>thesis:</strong> a photovoltaic cache will be vastly improved by a longer-lifetime phase change photonic memory system.</p>

    <div class="links">
    <a class="btn" href="mailto:denizdogan1101@gmail.com">email</a>
    <a class="github" href="https://github.com/dcdeniz/cros" aria-label="View the repository on GitHub">

    </a>
    </div>
  </main>
</body>
</html>
